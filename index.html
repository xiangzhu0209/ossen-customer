<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歐昇 - 後台管理系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-app: #f4f6f9; --bg-sidebar: #192033; --primary: #6366f1; --primary-hover: #4f46e5; --text-main: #334155; --text-sub: #94a3b8; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-app); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 220px; background: var(--bg-sidebar); color: white; display: flex; flex-direction: column; padding: 20px; }
        .brand { font-size: 20px; font-weight: bold; margin-bottom: 40px; }
        .nav-item { padding: 12px 15px; background: rgba(255,255,255,0.1); border-radius: 8px; font-weight: bold; margin-bottom: 10px; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { background: white; padding: 20px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .content-scroll { padding: 30px; overflow-y: auto; display: grid; grid-template-columns: 350px 1fr; gap: 30px; align-items: start; }
        .card { background: white; padding: 25px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: var(--text-sub); margin-bottom: 5px; }
        .form-input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: #f8fafc; outline: none; }
        .form-input:focus { border-color: var(--primary); background: white; }
        .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: #f8fafc; color: var(--text-sub); font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge-active { background: #d1fae5; color: #047857; }
        .badge-disabled { background: #fee2e2; color: #b91c1c; }
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-sm { padding: 6px 10px; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-toggle { background: #f1f5f9; color: var(--text-main); }
        .btn-edit { background: #e0e7ff; color: #4338ca; }
        .btn-save { background: #10b981; color: white; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">🏢 歐昇後台</div>
        <div class="nav-item">人員權限管理</div>
    </aside>
    <main class="main-content">
        <header class="header">
            <h1>人員帳號與權限管理</h1>
            <span style="font-weight: bold; color: var(--text-sub);">管理者模式</span>
        </header>
        <div class="content-scroll">
            <div class="card">
                <div class="card-title">➕ 新增門市人員</div>
                <div class="form-group"><label>顯示姓名 (例如：阿傑)</label><input type="text" id="newUserName" class="form-input"></div>
                <div class="form-group"><label>登入帳號 (例如：jie)</label><input type="text" id="newUserAccount" class="form-input"></div>
                <div class="form-group"><label>初始密碼 (至少6碼)</label><input type="text" id="newUserPwd" class="form-input"></div>
                <div class="form-group"><label>系統權限</label><select id="newUserRole" class="form-input"><option value="staff">一般人員</option><option value="manager">店長</option></select></div>
                <button class="btn-submit" id="btnAddMember">建立人員帳號</button>
            </div>
            <div class="card">
                <div class="card-title">👥 目前系統人員名單 (可直接編輯)</div>
                <table>
                    <thead><tr><th>姓名</th><th>登入帳號</th><th>權限</th><th>目前狀態</th><th>操作</th></tr></thead>
                    <tbody id="memberList"></tbody>
                </table>
            </div>
        </div>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8e3-lzsYTkzcnaBoDtAUy1P-M7uFVWUw",
      authDomain: "ossen-customer.firebaseapp.com",
      projectId: "ossen-customer",
      storageBucket: "ossen-customer.firebasestorage.app",
      messagingSenderId: "75601038718",
      appId: "1:75601038718:web:5ba088a89eeacc8f24b72f",
      measurementId: "G-Q52JL612DR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    const adminApp = initializeApp(firebaseConfig, "AdminApp");
    const adminAuth = getAuth(adminApp);

    const memberList = document.getElementById('memberList');
    let usersData = [];

    // 監聽 Firebase 用戶資料庫
    onSnapshot(collection(db, "users"), (snapshot) => {
        usersData = [];
        memberList.innerHTML = "";
        snapshot.forEach((docSnap) => {
            const user = { id: docSnap.id, ...docSnap.data() };
            usersData.push(user);
            
            const roleText = user.role === 'manager' ? '店長' : '一般人員';
            const statusBadge = user.status === 'active' 
                ? '<span class="badge badge-active">🟢 正常啟用</span>' 
                : '<span class="badge badge-disabled">🔴 已停用</span>';
            const toggleBtnText = user.status === 'active' ? '暫停權限' : '恢復啟用';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <span class="view-mode" style="font-weight:bold; color:var(--primary);">${user.name}</span>
                    <input type="text" class="form-input edit-mode edit-name" value="${user.name}" style="display:none; padding:4px 8px;">
                </td>
                <td>
                    <span class="view-mode">${user.account}</span>
                    <span class="edit-mode" style="display:none; color:var(--text-sub);">${user.account} (帳號不開放修改)</span>
                </td>
                <td>
                    <span class="view-mode">${roleText}</span>
                    <select class="form-input edit-mode edit-role" style="display:none; padding:4px 8px;">
                        <option value="staff" ${user.role === 'staff' ? 'selected' : ''}>一般人員</option>
                        <option value="manager" ${user.role === 'manager' ? 'selected' : ''}>店長</option>
                    </select>
                </td>
                <td>${statusBadge}</td>
                <td class="action-btns">
                    <button class="btn-sm btn-edit" data-id="${user.id}">編輯</button>
                    <button class="btn-sm btn-save edit-mode" data-id="${user.id}" style="display:none;">儲存</button>
                    <button class="btn-sm btn-toggle" data-id="${user.id}" data-status="${user.status}">${toggleBtnText}</button>
                    <button class="btn-sm btn-delete" data-id="${user.id}">刪除</button>
                </td>
            `;
            memberList.appendChild(tr);
        });
        
        // 綁定編輯按鈕
        document.querySelectorAll('.btn-edit').forEach(btn => {
            btn.onclick = (e) => {
                const tr = e.target.closest('tr');
                tr.querySelectorAll('.view-mode').forEach(el => el.style.display = 'none');
                tr.querySelectorAll('.edit-mode').forEach(el => el.style.display = 'inline-block');
                e.target.style.display = 'none'; // 隱藏編輯按鈕
            };
        });

        // 綁定儲存按鈕
        document.querySelectorAll('.btn-save').forEach(btn => {
            btn.onclick = async (e) => {
                const tr = e.target.closest('tr');
                const id = btn.dataset.id;
                const newName = tr.querySelector('.edit-name').value.trim();
                const newRole = tr.querySelector('.edit-role').value;

                if (!newName) {
                    alert("姓名不得為空白！");
                    return;
                }

                try {
                    await updateDoc(doc(db, "users", id), {
                        name: newName,
                        role: newRole
                    });
                    alert("修改成功！");
                } catch (err) {
                    alert("更新失敗：" + err.message);
                }
            };
        });

        // 綁定狀態切換按鈕
        document.querySelectorAll('.btn-toggle').forEach(btn => {
            btn.onclick = async () => {
                const newStatus = btn.dataset.status === 'active' ? 'disabled' : 'active';
                await updateDoc(doc(db, "users", btn.dataset.id), { status: newStatus });
            };
        });

        // 綁定刪除按鈕
        document.querySelectorAll('.btn-delete').forEach(btn => {
            btn.onclick = async () => {
                if(confirm("確定要刪除這位人員的紀錄嗎？(建議使用暫停權限即可)")) {
                    await deleteDoc(doc(db, "users", btn.dataset.id));
                }
            };
        });
    });

    // 新增人員按鈕事件
    document.getElementById('btnAddMember').onclick = async () => {
        const name = document.getElementById('newUserName').value.trim();
        const account = document.getElementById('newUserAccount').value.trim();
        const pwd = document.getElementById('newUserPwd').value.trim();
        const role = document.getElementById('newUserRole').value;

        if (!name || !account || !pwd || pwd.length < 6) {
            alert("請完整填寫姓名、帳號，且密碼需至少6碼！"); return;
        }

        try {
            const email = `${account}@osheng.tw`;
            await createUserWithEmailAndPassword(adminAuth, email, pwd);
            await signOut(adminAuth); 

            await addDoc(collection(db, "users"), {
                name: name,
                account: account,
                email: email,
                role: role,
                status: "active",
                createdAt: new Date().toISOString()
            });

            alert(`人員 [${name}] 已成功新增！前台將立即同步。`);
            document.getElementById('newUserName').value = "";
            document.getElementById('newUserAccount').value = "";
            document.getElementById('newUserPwd').value = "";
        } catch (error) {
            alert("新增失敗，可能是帳號已存在。錯誤訊息：" + error.message);
        }
    };
</script>
</body>
</html>
